<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/common/navbar.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/common/spinner.css">
    <link rel="stylesheet" href="/css/auth/auth-forms.css">
    <title>Reset password</title>
</head>
<body class="auth-page">
    {% include "auth-navbar.njk" %}


    <main class="auth-main">
        <form id="resetPasswordForm" action="/php/auth/resetPassword.php" method="POST">
            <h1>Reset password</h1>
            <input type="hidden" name="token" id="token">
            <input type="password" name="password" placeholder="New password" required
                pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}"
                title="Must be 8+ chars with at least one letter and one number">
            <input type="password" name="confirmPassword" placeholder="Confirm new password" required>
            <button type="submit">Save password</button>
        </form>
    </main>

{% include "footer.njk" %}

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (!token) {
            alert('Invalid recovery link.');
            window.location.href = '/html/auth/login.html';
        } else {
            document.getElementById('token').value = token;
        }
    </script>
    <script src="/javascript/common/ErrorHandlingHelper.js"></script>
    <script src="/javascript/common/requestHandler.js"></script>
</body>
</html>
